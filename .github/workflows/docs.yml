name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - run: |
          cd Intro-to-Zeek/
          npm ci
      - run: |
          cd Intro-to-Zeek/
          npm run build
          npm run pdf

      - name: Upload docs
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./Intro-to-Zeek/slides

  deploy-ghpages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  deploy-s3:
    environment:
      name: s3
      url: https://static.zeek.org/zeek-intro
    runs-on: ubuntu-latest
    needs: build
    steps:
      # We reuse the github-pages artifact, but it has a peculiar structure and
      # we need to basically decompress it twice (first with the
      # `download-artifact` action, then the contained tar file).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: .
      - run: |
          mkdir slides
          tar -xf artifact.tar -C slides

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.STATIC_ZEEK_ORG_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.STATIC_ZEEK_ORG_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload
        run: |
          DIR=zeek-intro

          aws s3 sync slides s3://static.zeek.org/$DIR --delete

          # Invalidate cloudfront so the changes become reachable immediately.
          aws cloudfront create-invalidation --distribution-id ${{ secrets.STATIC_ZEEK_ORG_CLOUDFRONT_DISTRIBUTION }} --paths "/$DIR/*"
